<!DOCTYPE html> <!-- Aqui defino o tipo do documento, no caso html.-->
<html lang="pt-br"> <!-- Aqui defino o idioma que vai ser escrito o código-->
<head> <!-- Dentro de 'head' é colocado tudo que sera utilizado pelo browser-->
    <meta charset="UTF-8"> <!-- a tag meta com o atributo charset, define como o browser vai interpretar os acentos.-->
    <title>Estrutura HTML</title>
</head>
<body> <!-- Todo o conteúdo do código que será "visto" ficará dentro do body-->
    
</body>
</html>
